<div class="song-display-header">
  <app-button>Add new</app-button>
</div>
<div class="songs-container">
  <div *ngFor="let song of songs; trackBy: trackBySongId" class="song-wrapper">
    <div class="song-select">
      <input type="checkbox" />
    </div>
    <div class="song-title"> {{ song.name }} </div>
    <div class="song-length"> {{ song.duration }} </div>
    <div class="song-controls"> X </div>
  </div>
</div>
