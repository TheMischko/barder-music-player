<div class="page-wrapper">
  <div class="page-header">
    <img [src]="playlist?.coverImage" alt="Cover Image" class="cover-image" />
    <div class="breadcrumbs">
      <div class="breadcrumb">
        <a routerLink="/">Playlists</a>
      </div>
      <div
        *ngFor="let parent of parentPlaylists.toReversed(); trackBy: trackByPlaylistId"
        class="breadcrumb"
      >
        <span>></span>
        <a [routerLink]="['/playlist', parent.id]">{{ parent.name }}</a>
      </div>
    </div>
    <h1>{{ playlist?.name ?? "Playlist" }}</h1>
  </div>
  <div class="page-content">
    <app-collapsible-container title="Playlists">
      <div class="playlist-list card-wrapper">
        <app-add-new-card (click)="openNewPlaylistModal()"></app-add-new-card>
        <app-playlist-card
          *ngFor="let childPlaylist of childPlaylists; trackBy: trackByPlaylistId"
          [playlist]="childPlaylist"
        ></app-playlist-card>
      </div>
    </app-collapsible-container>

    <app-collapsible-container title="Songs">
      <app-song-displayer [playlist]="playlist"></app-song-displayer>
    </app-collapsible-container>

    <div style="min-height: 200px; width: 100%; padding: 10px">&nbsp;</div>
  </div>
</div>
